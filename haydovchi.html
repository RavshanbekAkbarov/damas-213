<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>213 Damas: Haydovchi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="manifest" href="manifest-haydovchi.json">
<meta name="theme-color" content="#1f7a4d">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  #map { height: 42vh; flex: none; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 480px;
         width: 100%; margin: 0 auto; box-sizing: border-box; }
  .card { background: var(--panel); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .counter { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .counter button { font-size: 40px; width: 90px; height: 90px; border-radius: 20px; }
  .count { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .status { font-size: 18px; font-weight: 600; }
  input { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--muted);
          background: var(--bg); color: var(--fg); }
</style>
</head>
<body>

<header><h1>🚐 213 Damas: Haydovchi</h1></header>
<div id="alert" class="alert" hidden></div>
<div id="soundHint" class="sound-hint">🔔 Ovozli signal uchun ekranga bir marta teging</div>
<div id="map"></div>

<main>
  <!-- Kirish: login va parolni Ravshanbek beradi -->
  <form id="loginForm" class="card" hidden>
    <b>Haydovchi sifatida kirish</b>
    <input id="login" placeholder="Login (masalan: akmal)" autocomplete="username" required>
    <input id="password" type="password" placeholder="Parol" autocomplete="current-password" required>
    <small id="loginError" style="color:var(--late)"></small>
    <button class="main">Kirish</button>
  </form>

  <!-- Birinchi kirishda: ism va telefon -->
  <form id="profileForm" class="card" hidden>
    <b>Maʼlumotlaringiz (yoʻlovchilar koʻradi)</b>
    <input id="name" placeholder="Ismingiz" required>
    <input id="phone" placeholder="+998 90 123 45 67" required>
    <button class="main">Saqlash</button>
  </form>

  <!-- Asosiy panel -->
  <section id="panel" hidden>
    <div class="card">
      <div class="status" id="status">…</div>
      <small id="gps" style="color:var(--muted)"></small>
    </div>
    <div class="card">
      <span>Damasdagi odamlar</span>
      <div class="counter">
        <button id="minus">➖</button>
        <span class="count" id="count">0/7</span>
        <button id="plus" class="main">➕</button>
      </div>
    </div>
    <div class="card">
      <button id="goRoad" class="main">🚦 Yoʻlga chiqdim</button>
      <button id="atQishloq">🅿️ Qishloq pitakka keldim</button>
      <button id="atFargona">🅿️ Fargʻona pitakka keldim</button>
    </div>
    <button id="logout">Chiqish</button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { ref, onValue, onChildAdded, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth, loginToEmail, CAP, PITAKS, queueAt } from "./config.js";
import { liveMap } from "./map.js";
import { setupInstall } from "./install.js";

const $ = id => document.getElementById(id);
let myId = null, me = null, drivers = {}, started = false;

// Xarita: haydovchi ham kutayotgan yo'lovchilarni ko'radi
const map = liveMap("map", { myDriverId: () => myId });
setupInstall({ title: "Haydovchi ilovasini oʻrnating", storageKey: "installSeenDriver" });

// ===== Kirish =====
onAuthStateChanged(auth, user => {
  const isDriver = user && !user.isAnonymous;
  $("loginForm").hidden = isDriver;
  if (!isDriver) { $("panel").hidden = $("profileForm").hidden = true; return; }
  myId = user.uid;
  start();
});

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  $("loginError").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, loginToEmail($("login").value), $("password").value);
  } catch (err) {
    $("loginError").textContent = "Login yoki parol notoʻgʻri. Qayta urinib koʻring.";
  }
};

$("profileForm").onsubmit = e => {
  e.preventDefault();
  set(ref(db, "drivers/" + myId), {
    name: $("name").value.trim(), phone: $("phone").value.trim(),
    people: 0, status: "pitak", pitak: "qishloq", queuedAt: Date.now()
  });
};

$("logout").onclick = () => { stopGps(); signOut(auth); };

// ===== Jonli holat =====
function start() {
  if (started) return;
  started = true;
  onValue(ref(db, "drivers"), snap => {
    drivers = snap.val() || {};
    me = drivers[myId];
    $("profileForm").hidden = !!me;      // birinchi kirishda ism-telefon so'raymiz
    $("panel").hidden = !me;
    if (me) render();
  });
}

function render() {
  $("count").textContent = `${me.people}/${CAP}`;
  if (me.status === "road") {
    $("status").textContent = "🚦 Siz yoʻldasiz";
    startGps();                       // sahifa qayta ochilsa ham GPS davom etadi
  } else {
    stopGps();
    const place = queueAt(drivers, me.pitak).findIndex(([id]) => id === myId) + 1;
    $("status").textContent = place === 1
      ? `✅ Navbatingiz keldi! (${PITAKS[me.pitak].name})`
      : `🅿️ ${PITAKS[me.pitak].name}: navbatda ${place}-oʻrindasiz`;
  }
}

// ===== Tugmalar =====
const save = data => update(ref(db, "drivers/" + myId), data);

$("plus").onclick  = () => me && me.people < CAP && save({ people: me.people + 1 });
$("minus").onclick = () => me && me.people > 0   && save({ people: me.people - 1 });
$("goRoad").onclick = () => { if (me.status !== "road") save({ status: "road", from: me.pitak }); };

// Pitakka kelganda: hamma tushadi, navbat oxiriga turadi
const arrive = key => save({ status: "pitak", pitak: key, queuedAt: Date.now(), people: 0 });
$("atQishloq").onclick = () => arrive("qishloq");
$("atFargona").onclick = () => arrive("fargona");

// ===== Yangi yo'lovchi: baland signal =====
let audio = null;
// Brauzer ovozni faqat foydalanuvchi ekranga tekkandan keyin ruxsat beradi
document.addEventListener("click", () => {
  if (!audio) audio = new AudioContext();
  audio.resume();
  $("soundHint").hidden = true;
});

onChildAdded(ref(db, "passengers"), snap => {
  const p = snap.val();
  if (!me || Date.now() - p.since > 2 * 60000) return;   // eski yo'lovchilar uchun signal yo'q

  // Kimga signal: yo'ldagi haydovchiga (8 km ichida) va pitakda navbati kelganga
  const firstInQueue = me.status === "pitak" && queueAt(drivers, me.pitak)[0]?.[0] === myId;
  const onRoad = me.status === "road";
  if (!firstInQueue && !onRoad) return;

  let far = "";
  if (me.lat) {
    const km = distance([me.lat, me.lng], [p.lat, p.lng]) / 1000;
    if (onRoad && km > 8) return;
    far = ` · ${km.toFixed(1)} km`;
  }
  alertDriver(p, far);
});

function alertDriver(p, far) {
  const box = $("alert");
  box.textContent = `🙋 Yangi yoʻlovchi${far}`;
  box.hidden = false;
  box.onclick = () => { box.hidden = true; map.setView([p.lat, p.lng], 16); };
  setTimeout(() => box.hidden = true, 15000);
  beep();
  navigator.vibrate?.([400, 200, 400, 200, 400]);
}

// 3 marta baland "bip-bip" (kvadrat to'lqin oddiy ovozdan balandroq eshitiladi)
function beep() {
  if (!audio) return;
  const t = audio.currentTime;
  for (let i = 0; i < 6; i++) {
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "square";
    osc.frequency.value = i % 2 ? 1320 : 880;
    gain.gain.value = 0.8;
    osc.connect(gain).connect(audio.destination);
    osc.start(t + i * 0.25); osc.stop(t + i * 0.25 + 0.2);
  }
}

// ===== GPS (faqat yo'lda) =====
let watchId = null, lastSent = 0, wakeLock = null;

function startGps() {
  if (watchId !== null) return;
  if (!navigator.geolocation) { $("gps").textContent = "❌ Bu telefonda GPS yoʻq"; return; }
  keepScreenOn();
  watchId = navigator.geolocation.watchPosition(onPosition,
    err => $("gps").textContent = "❌ GPS ishlamayapti: joylashuvga ruxsat bering",
    { enableHighAccuracy: true, maximumAge: 5000 });
}

function stopGps() {
  if (watchId === null) return;
  navigator.geolocation.clearWatch(watchId); watchId = null;
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  $("gps").textContent = "📴 GPS oʻchiq (pitakdasiz)";
}

function onPosition(pos) {
  const here = [pos.coords.latitude, pos.coords.longitude];

  // Boshqa pitakka 150 m yaqinlashsa: avtomatik navbatga turadi
  for (const key in PITAKS) {
    if (key !== me.from && distance(here, PITAKS[key].at) < 150) return arrive(key);
  }

  // Har 10 soniyada bir marta yuboramiz (internet va Firebase'ni tejash uchun)
  if (Date.now() - lastSent < 10000) return;
  if (!lastSent) map.setView(here, 14);          // birinchi marta o'zimizga yaqinlashamiz
  lastSent = Date.now();
  save({ lat: here[0], lng: here[1], updatedAt: Date.now() });
  $("gps").textContent = "📡 GPS yoqiq · joylashuv yuborildi " + new Date().toLocaleTimeString("uz");
}

// Ekran o'chmasligi uchun (o'chsa brauzer GPS'ni to'xtatadi)
async function keepScreenOn() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && watchId !== null) keepScreenOn();
});

// Ikki nuqta orasidagi masofa (metr), Haversine formulasi
function distance([lat1, lng1], [lat2, lng2]) {
  const r = Math.PI / 180, R = 6371000;
  const a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lng2 - lng1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
</script>
</body>
</html>
