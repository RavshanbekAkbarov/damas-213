<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>213 Damas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a4d">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🚐 213 Damas</h1>
  <button id="btnInstall" hidden>📲 Oʻrnatish</button>
  <button id="btnGo" class="main">🙋 Men ketaman</button>
  <div class="stats" id="stats"></div>
</header>

<div id="map" style="flex:1"></div>
<div id="hint" hidden>Turgan joyingizni xaritada bosing</div>
<div id="elon"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { db, auth } from "./config.js";
import { liveMap, statsHtml } from "./map.js";
import { setupInstall } from "./install.js";
import { adHtml, adStatus, DEFAULT_ADS } from "./elon.js";
import { trackUser, dayKey, countAdView, countAdClick } from "./stats.js";

const $ = id => document.getElementById(id);

// Yo'lovchi ro'yxatdan o'tmaydi. Avval tekshiramiz: bu telefon allaqachon kirganmi
// (anonim, haydovchi yoki admin). Faqat hech kim kirmagan bo'lsa, yangi anonim akkaunt ochiladi.
const ready = new Promise(resolve => {
  const stop = onAuthStateChanged(auth, user => {
    stop();
    resolve(user ? { user } : signInAnonymously(auth));
  });
});
ready.then(({ user }) => trackUser(user.uid, "yolovchi"));

// ===== Xarita =====
let passengers = {};
const map = liveMap("map", {
  myPaxId,
  onUpdate: (d, p, stats) => {
    passengers = p;
    $("stats").innerHTML = statsHtml(stats);
    updateButton();
  }
});

// ===== "Men ketaman" tugmasi =====
const btn = $("btnGo"), hint = $("hint");
let picking = false;

function showToast(text) {
  let t = $("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.append(t); }
  t.textContent = text; t.hidden = false;
  clearTimeout(t.timer); t.timer = setTimeout(() => t.hidden = true, 5000);
}

function myPaxId() { try { return localStorage.getItem("myPax"); } catch (e) { return null; } }
function setMyId(id) { try { id ? localStorage.setItem("myPax", id) : localStorage.removeItem("myPax"); } catch (e) {} }

let wasWaiting = null;   // oxirgi marta ko'rgan o'z belgimiz
function updateButton() {
  const waiting = myPaxId() && passengers[myPaxId()];
  // Belgimiz o'zimiz bosmasdan yo'qoldi: yo haydovchi oldi, yo 40 daqiqa o'tdi
  if (wasWaiting && !waiting && myPaxId()) {
    setMyId(null);
    const expired = Date.now() - wasWaiting.since > 39 * 60000;
    showToast(expired ? "⏱ Kutish vaqti tugadi. Kerak boʻlsa qayta bosing." : "🚐 Damasga mindingiz. Oq yoʻl!");
  }
  wasWaiting = waiting || null;
  btn.textContent = waiting ? "❌ Bekor qilish" : "🙋 Men ketaman";
  btn.className = waiting ? "danger" : "main";
}

btn.onclick = () => {
  if (myPaxId() && passengers[myPaxId()]) {        // bekor qilish
    remove(ref(db, "passengers/" + myPaxId())); setMyId(null); wasWaiting = null; return;
  }
  // Avval GPS bilan joyni o'zi aniqlaymiz
  btn.textContent = "📍 Joy aniqlanmoqda…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      addMe(pos.coords.latitude, pos.coords.longitude);
      map.setView([pos.coords.latitude, pos.coords.longitude], 16);
    },
    () => { picking = true; hint.hidden = false; updateButton(); }, // ruxsat bo'lmasa: xaritada bosish
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

async function addMe(lat, lng) {
  const { user } = await ready;
  const newRef = push(ref(db, "passengers"), { lat, lng, since: Date.now(), uid: user.uid });
  setMyId(newRef.key);
  picking = false; hint.hidden = true;
}

map.on("click", e => { if (picking) addMe(e.latlng.lat, e.latlng.lng); });

// ===== O'rnatish oynasi =====
setupInstall({ title: "213 Damasni telefoningizga oʻrnating", buttonId: "btnInstall", videoId: "" }); // videoId: YouTube havolasidagi v= dan keyingi qism

// ===== Reklama (admin paneldan keladi) =====
let ads = DEFAULT_ADS, adIndex = 0;
onValue(ref(db, "ads"), snap => {
  const active = Object.entries(snap.val() || {})
    .map(([id, ad]) => ({ ...ad, id }))
    .filter(ad => adStatus(ad, dayKey()) === "running");
  ads = active.length ? active : DEFAULT_ADS;   // faol reklama bo'lmasa: taklif matnlari
  adIndex = 0; showAd();
});
function showAd() {
  const ad = ads[adIndex++ % ads.length];
  $("elon").innerHTML = adHtml(ad);
  countAdView(ad.id);
}
$("elon").addEventListener("click", e => {
  const btn = e.target.closest(".e-btn");
  if (btn) countAdClick(btn.dataset.id);
});
showAd(); setInterval(showAd, 10000);   // har 10 soniyada almashadi
</script>
</body>
</html>
